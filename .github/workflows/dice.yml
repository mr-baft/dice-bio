name: Dice Bio

on:
  schedule:
    - cron: "*/30 * * * *"  # فقط برای اینکه همیشه یه اجرای بعدی توی صف باشه
  workflow_dispatch:         # دکمه‌ی اجرای دستی برای تست

permissions:
  actions: write             # فقط برای اینکه زمان‌بندی بعد از ۶۰ روز خاموش نشه

# هر اجرا نزدیک ۶ ساعت روشن می‌مونه؛ اجرای بعدی توی صف منتظر می‌مونه و بلافاصله جاش رو می‌گیره
concurrency:
  group: dice-bio
  cancel-in-progress: false

jobs:
  roll:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Install Telethon
        run: pip install --quiet telethon

      - name: Roll dice every minute
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.SESSION }}
          BIO_TEMPLATE: ${{ vars.BIO_TEMPLATE }}
          INTERVAL: ${{ vars.INTERVAL }}
        run: |
          python - <<'EOF'
          import os, random, asyncio, time
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from telethon.tl.functions.account import UpdateProfileRequest
          from telethon.errors import FloodWaitError

          FACES = "⚀⚁⚂⚃⚄⚅"
          TZ = ZoneInfo("Asia/Tehran")
          template = os.environ.get("BIO_TEMPLATE") or "{time} - this time dice { {dice} }"
          interval = max(30, int(os.environ.get("INTERVAL") or 60))
          deadline = time.time() + 350 * 60   # چند دقیقه قبل از سقف ۶ ساعته‌ی گیت‌هاب تموم کن

          async def main():
              client = TelegramClient(
                  StringSession(os.environ["SESSION"]),
                  int(os.environ["API_ID"]),
                  os.environ["API_HASH"],
              )
              await client.connect()
              try:
                  if not await client.is_user_authorized():
                      raise SystemExit("SESSION is invalid or expired - make a new one with get_session.py")
                  while time.time() < deadline:
                      dice = " ".join(random.choice(FACES) for _ in range(3))
                      now = datetime.now(TZ).strftime("%H:%M")
                      bio = template.replace("{time}", now).replace("{dice}", dice)[:70]
                      try:
                          await client(UpdateProfileRequest(about=bio))
                          print("Bio updated:", bio, flush=True)
                          # تا شروع دقیقه‌ی بعد صبر کن تا ساعت توی بیو دقیق باشه
                          await asyncio.sleep(interval - time.time() % interval)
                      except FloodWaitError as e:
                          print(f"Telegram asked to wait {e.seconds}s", flush=True)
                          await asyncio.sleep(e.seconds + 5)
              finally:
                  await client.disconnect()

          asyncio.run(main())
          EOF

      - name: Keep schedule alive
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/dice.yml/enable" || true
