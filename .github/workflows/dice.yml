name: Dice Bio

on:
  schedule:
    - cron: "*/30 * * * *"  # فقط برای اینکه همیشه یه اجرای بعدی توی صف باشه
  workflow_dispatch:         # دکمه‌ی اجرای دستی برای تست

permissions:
  actions: write             # فقط برای اینکه زمان‌بندی بعد از ۶۰ روز خاموش نشه

# هر اجرا نزدیک ۶ ساعت روشن می‌مونه؛ اجرای بعدی توی صف منتظر می‌مونه و بلافاصله جاش رو می‌گیره
concurrency:
  group: dice-bio
  cancel-in-progress: false

jobs:
  roll:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4   # برای خوندن lines.json

      - name: Install Telethon
        run: pip install --quiet telethon

      - name: Roll dice every minute
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.SESSION }}
          BIO_TEMPLATE: ${{ vars.BIO_TEMPLATE }}
          INTERVAL: ${{ vars.INTERVAL }}
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: |
          python - <<'EOF'
          import os, random, asyncio, time, json, subprocess
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from telethon.tl.functions.account import UpdateProfileRequest
          from telethon.errors import FloodWaitError

          FACES = "⚀⚁⚂⚃⚄⚅"
          TZ = ZoneInfo("Asia/Tehran")
          LINES = json.load(open("lines.json", encoding="utf-8"))   # سه دیتاست: witty / dev / soft
          template = os.environ.get("BIO_TEMPLATE") or "{time} { {dice} } {line}"
          interval = max(30, int(os.environ.get("INTERVAL") or 60))
          deadline = time.time() + 350 * 60   # چند دقیقه قبل از سقف ۶ ساعته‌ی گیت‌هاب تموم کن

          def queue_next_run():
              # اجرای بعدی رو توی صف می‌ذاره؛ به‌خاطر concurrency صبر می‌کنه و به‌محض تموم شدن این اجرا شروع می‌شه
              r = subprocess.run(["gh", "workflow", "run", "dice.yml", "--ref", os.environ["REF"]],
                                 capture_output=True, text=True)
              print("Next run queued" if r.returncode == 0 else f"Could not queue next run: {r.stderr.strip()}", flush=True)

          async def main():
              queued = False
              client = TelegramClient(
                  StringSession(os.environ["SESSION"]),
                  int(os.environ["API_ID"]),
                  os.environ["API_HASH"],
              )
              await client.connect()
              try:
                  if not await client.is_user_authorized():
                      raise SystemExit("SESSION is invalid or expired - make a new one with get_session.py")
                  while time.time() < deadline:
                      roll = [random.randint(1, 6) for _ in range(3)]
                      dice = " ".join(FACES[n - 1] for n in roll)
                      key = "".join(map(str, roll))
                      if key in LINES["special"]:   # ترکیب‌های موردعلاقه (۱ و ۲) همیشه جمله‌ی خاص خودشون رو دارن
                          line = random.choice(LINES["special"][key])
                      else:
                          line = LINES[random.choice(["witty", "dev", "soft"])][key]
                      now = datetime.now(TZ).strftime("%H:%M")
                      bio = template.replace("{time}", now).replace("{dice}", dice).replace("{line}", line)[:70]
                      try:
                          await client(UpdateProfileRequest(about=bio))
                          print("Bio updated:", bio, flush=True)
                          if not queued:   # فقط بعد از اولین آپدیت موفق، تا اجرای خراب پشت سر هم تکرار نشه
                              queue_next_run()
                              queued = True
                      except FloodWaitError as e:
                          print(f"Telegram asked to wait {e.seconds}s", flush=True)
                          await asyncio.sleep(min(e.seconds + 5, max(0, deadline - time.time())))
                          continue
                      except Exception as e:   # خطای موقت شبکه نباید کل اجرا رو بخوابونه
                          print(f"Update failed, retrying next minute: {e!r}", flush=True)
                      # تا شروع دقیقه‌ی بعد صبر کن تا ساعت توی بیو دقیق باشه
                      await asyncio.sleep(interval - time.time() % interval)
              finally:
                  await client.disconnect()

          asyncio.run(main())
          EOF

      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/dice.yml/enable" || true
